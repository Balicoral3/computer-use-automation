# Optional: run the mock legacy bank app in a container.
services:
  target-app:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "pip install --quiet flask==3.0.3 && python -m cli.serve_app"
    ports:
      - "5000:5000"
    environment:
      - TARGET_APP_PORT=5000